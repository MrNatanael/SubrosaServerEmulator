name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version/tag (e.g. v1.2.3)
        required: true
        type: string

      build:
        description: Target Project
        required: true
        default: Both
        type: choice
        options:
          - Master
          - Intercept
          - Both

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Build Master
        if: inputs.build == 'Master' || inputs.build == 'Both'
        run: |
          chmod +x scripts/compile_server.sh
          ./scripts/compile_server.sh

      - name: Build Libraries
        if: inputs.build == 'Intercept' || inputs.build == 'Both'
        run: |
          chmod +x scripts/compile_libs.sh
          ./scripts/compile_libs.sh

      - name: List build output
        run: |
          echo "=== Master ==="
          find build/bin/Master -type f -print 2>/dev/null || true

          echo "=== Intercept ==="
          find build/bin/libs -type f -print 2>/dev/null || true

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          if [ -d build/bin/Master/linux-x64 ]; then
            find build/bin/Master/linux-x64 -type f | while read -r file; do
              name=$(basename "$file")

              if [[ "$name" == *.pdb ]]; then
                cp "$file" "release-assets/${name%.pdb}-linux-x64.pdb"
              else
                cp "$file" "release-assets/$name"
              fi
            done
          fi

          if [ -d build/bin/Master/win-x64 ]; then
            find build/bin/Master/win-x64 -type f | while read -r file; do
              name=$(basename "$file")

              if [[ "$name" == *.pdb ]]; then
                cp "$file" "release-assets/${name%.pdb}-win-x64.pdb"
              else
                cp "$file" "release-assets/$name"
              fi
            done
          fi

          if [ -d build/bin/libs ]; then
            find build/bin/libs -type f -exec cp {} release-assets/ \;
          fi

          echo "=== Release assets ==="
          ls -lh release-assets

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.version }}"

          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            release-assets/*